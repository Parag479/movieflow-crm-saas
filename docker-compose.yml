version: '3.8'

services:
  # Next.js Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/movieflow_crm?schema=public
      - JWT_SECRET=movieflow-super-secret-jwt-key-2026-production
      - NODE_ENV=production
    depends_on:
      - postgres
    restart: always

  # PostgreSQL Multi-Tenant Database
  postgres:
    image: postgres:16-alpine
    container_name: movieflow_postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=movieflow_crm
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: movieflow_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
    restart: always

volumes:
  postgres_data:
